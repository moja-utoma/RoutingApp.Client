name: Deploy Angular App to Azure

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RoutingApp.UI

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        run: npm install

      - name: Copy environment template
        run: cp RoutingApp.UI/src/environments/environment.example.ts RoutingApp.UI/src/environments/environment.ts

      - name: Build the Angular app
        run: npm run build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'routing-app-ui'
          slot-name: 'development'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: RoutingApp.UI/dist/RoutingApp.UI
