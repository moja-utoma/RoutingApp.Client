# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main
- dev

pool:
  vmImage: ubuntu-latest

variables:
  - group: AngularSecrets

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Install Node.js'

- script: npm install
  workingDirectory: RoutingApp.UI
  displayName: 'Install dependencies'

- script: |
    cp src/environments/environment.example.ts src/environments/environment.ts
    sed -i "s|__CLIENT_ID__|${CLIENT_ID}|g" src/environments/environment.ts
    sed -i "s|__AUTHORITY__|${AUTHORITY}|g" src/environments/environment.ts
    sed -i "s|__REDIRECT_URI__|${REDIRECT_URI}|g" src/environments/environment.ts
    sed -i "s|__CACHE_LOCATION__|${CACHE_LOCATION}|g" src/environments/environment.ts
    sed -i "s|__API_BASE_URL__|${API_BASE_URL}|g" src/environments/environment.ts
    sed -i "s|__API_SCOPE__|${API_SCOPE}|g" src/environments/environment.ts
    sed -i "s|__AUTH0_DOMAIN__|${AUTH0_DOMAIN}|g" src/environments/environment.ts
    sed -i "s|__AUTH0_CLIENT_ID__|${AUTH0_CLIENT_ID}|g" src/environments/environment.ts
    sed -i "s|__AUTH0_AUDIENCE__|${AUTH0_AUDIENCE}|g" src/environments/environment.ts
    sed -i "s|__AUTH0_REDIRECT_URI__|${AUTH0_REDIRECT_URI}|g" src/environments/environment.ts
  workingDirectory: RoutingApp.UI
  displayName: 'Inject secrets into environment.ts'

- script: npm run build
  workingDirectory: RoutingApp.UI
  displayName: 'Build Angular app'

- script: |
    echo "=== Build output verification ==="
    if [ -d "dist/RoutingApp.UI/browser" ]; then
      echo "✓ Build directory exists"
      ls -lah dist/RoutingApp.UI/browser/
    else
      echo "✗ Build directory NOT found!"
      ls -lah dist/ || echo "dist/ doesn't exist"
      exit 1
    fi
  workingDirectory: RoutingApp.UI
  displayName: 'Verify build output'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'RoutingApp.UI/dist/RoutingApp.UI/browser'
    artifactName: 'angular-ui'
    publishLocation: Container
  displayName: 'publish'
